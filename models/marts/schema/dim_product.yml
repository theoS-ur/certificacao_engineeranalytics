 models:
         - name: dim_product
           description: "Dimensão de produtos"
           columns:
             - name: pk_product
               data_type: int
               description: "Chave primária"
               data_tests:
                 - unique
                 - not_null
       
             - name: product_name
               data_type: string
               description: "Nome do produto"
       
             - name: product_number
               data_type: string
               description: "Número do produto"
       
             - name: productcategory_name
               data_type: string
               description: "Categoria do produto"
       
             - name: productsubcategoy_name
               data_type: string
               description: "Subcategoria do produto"