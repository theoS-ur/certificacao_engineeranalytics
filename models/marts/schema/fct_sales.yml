 models:
         - name: fct_sales
           description: "Tabela fato de vendas"
           columns:
             - name: pk_sales
               data_type: int
               description: "Chave primária"
       
             - name: fk_salesorder
               data_type: int
               description: "Chave estrangeira da dimensão de pedidos"
               data_tests:
                 - relationships:
                      arguments: 
                        to: ref('dim_salesorder')
                        field: pk_salesorder
       
             - name: fk_product
               data_type: int
               description: "Chave estrangeira da dimensão de produtos"
               data_tests:
                 - relationships:
                      arguments: 
                        to: ref('dim_product')
                        field: pk_product
       
             - name: fk_customer
               data_type: int
               description: "Chave estrangeira da dimensão de clientes"
               data_tests:
                  - relationships:
                        arguments:
                          to: ref('dim_customer')
                          field: pk_customer
             
             - name: fk_creditcard
               data_type: int
               description: "Chave estrangeira da dimensão de cartões"
               data_tests:
                  - relationships:
                        arguments:
                          to: ref('dim_creditcard')
                          field: pk_creditcard

             - name: fk_order_date
               data_type: int
               description: "Chave estrangeira da data do pedido"
               data_tests:
                 - relationships: 
                      arguments: 
                        to: ref('dim_date')
                        field: pk_data
       
             - name: fk_ship_date
               data_type: int
               description: "Chave estrangeira da data de entrega"
               data_tests:
                 - relationships: 
                      arguments: 
                       to: ref('dim_date')
                       field: pk_data
       
       
             - name: fk_due_date
               data_type: int
               description: "Chave estrangeira do prazo"
               data_tests:
                 - relationships: 
                      arguments: 
                       to: ref('dim_date')
                       field: pk_data
       
       
             - name: fk_ship_to_address
               data_type: int
               description: "Chave estrangeira do endereço de entrega"
               data_tests:
                 - relationships: 
                      arguments: 
                         to: ref('dim_address')
                         field: pk_address
       
             - name: fk_bill_to_address
               data_type: int
               description: "Chave estrangeira do endereço de cobrança"
               data_tests:
                 - relationships: 
                      arguments: 
                         to: ref('dim_address')
                         field: pk_address
             
             - name: order_date
               data_type: date
               description: "Data de pedido"  

             - name: ship_date
               data_type: date
               description: "Data de entrega"

             - name: due_date
               data_type: date
               description: "Prazo de entrega"  
       
             - name: order_qty
               data_type: bigint
               description: "Quantidade comoprada do produto na venda"
       
             - name: unit_price
               data_type: double
               description: "Preço unitário do produto"
       
             - name: gross_price
               data_type: double
               description: "Valor negociado do produto na venda"
       
             - name: unit_price_discount
               data_type: double
               description: "Desconto do produto na venda"
       
             - name: unit_price_discount_pct
               data_type: double
               description: "Porcentagem de desconto do produto na venda"
       
             - name: net_price
               data_type: double
               description: "Preço líquido do produto na venda"
       
             - name: freight
               data_type: double
               description: "Valor do frete"
       
             - name: tax
               data_type: double
               description: "Valor da taxa"
       
             - name: total_price
               data_type: double
               description: "Preço total do produto na venda"

             - name: modified_date
               data_type: date
               description: "Data de modificação da linha"