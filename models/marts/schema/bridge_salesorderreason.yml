models:
  - name: bridge_salesorderreason
    description: "Ponte que liga dimensão de motivos com dimensão de pedidos"
    columns:
      - name: fk_sales_order_header
        data_type: int
        description: "Chave estrangeira de pedidos"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesorder')
                field: pk_salesorder

      - name: fk_sales_reason
        data_type: int
        description: "Chave estrangeira de motivos"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesreason')
                field: pk_sales_reason
