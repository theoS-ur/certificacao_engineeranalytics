models:
  - name: dim_address
    description: "Dimensão de localidades"
    columns:
      - name: pk_address
        data_type: int
        description: "Cahve primária"
        data_tests:
                 - unique
                 - not_null

      - name: full_address
        data_type: string
        description: "Endereço completo com rua e número"

      - name: city_name
        data_type: string
        description: "Nome da cidade"

      - name: province_name
        data_type: string
        description: "Nome do estado"

      - name: country_name
        data_type: string
        description: "Nome do país"
