models:
  - name: dim_creditcard
    description: "Dimensão de cartões"
    columns:
      - name: pk_creditcard
        data_type: int
        description: "Chave primária"
        data_tests:
                 - unique
                 - not_null
      - name: card_type
        data_type: string
        description: "Tipo do cartão"

      - name: card_number
        data_type: string
        description: "Número do cartão"

      - name: exp_month
        data_type: bigint
        description: "Mes de válidade"

      - name: exp_year
        data_type: bigint
        description: "Ano de válidade"
