models:
  - name: dim_customer
    description: "Dimensão de clientes"
    columns:
      - name: pk_customer
        data_type: int
        description: "Chave primária"
        data_tests:
                 - unique
                 - not_null

      - name: person_id
        data_type: int
        description: "Id da pessoa"

      - name: person_name
        data_type: string
        description: "Nome da pessoa"
