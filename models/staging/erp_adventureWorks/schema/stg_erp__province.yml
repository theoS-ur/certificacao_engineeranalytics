  models:
         - name: stg_erp__province
           description: "Tabela com informações dos estados"
           columns:
             - name: pk_province
               data_type: int
               description: "Chave primária"
       
             - name: fk_country
               data_type: string
               description: "Chave estrangeira dos países"
       
             - name: fk_territory
               data_type: int
               description: "Chave estrangeira do território"
       
             - name: province_name
               data_type: string
               description: "Nome do estado"