models:
         - name: stg_erp__creditcard
           description: "Tablea que contém informações dos carõtes de crédito como tipo, número e válidade"
           columns:
             - name: pk_creditcard
               data_type: int
               description: "Chave primária"
       
             - name: card_type
               data_type: string
               description: "Tipo do cartão"
       
             - name: card_number
               data_type: string
               description: "Número do cartão"
       
             - name: exp_month
               data_type: bigint
               description: "Mês de válidade"
       
             - name: exp_year
               data_type: bigint
               description: "Ano de válidade"