models:
         - name: stg_erp__address
           description: "Tabela de endereços com rua e id do estado"
           columns:
             - name: pk_address
               data_type: int
               description: "Chave primária"
       
             - name: fk_province
               data_type: int
               description: "chave estrangeira dos estados"
       
             - name: full_address
               data_type: string
               description: "Rua e Número"
       
             - name: city
               data_type: string
               description: "Nome da cidade"