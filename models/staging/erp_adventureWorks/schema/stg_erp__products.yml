 models:
         - name: stg_erp__products
           description: "Tabela que contém informações dos produtos como nome e número"
           columns:
             - name: pk_product
               data_type: int
               description: "Chave primária"
       
             - name: fk_productsubcategory
               data_type: int
               description: "Chave estrangeira da subcategoria dos produtos"
       
             - name: product_name
               data_type: string
               description: "Nome do produto"
       
             - name: product_number
               data_type: string
               description: "Número do produto"